[alias]
appimage = "run --package xtask -- appimage"
fmt-all = "fmt --all"
fmt-all-check = "fmt --all -- --check"

# Main sub-programs.
#
# The processor frontends are workspace packages. Liminaldoc is a sibling
# workspace with its own target directory:
#
#   lege          package `lege`            — the CLI
#   lege-gui      package `lege-gui-freya`  — Freya processor GUI (default)
#   liminaldoc-reader / liminaldoc-writer  — native reader and writer
#
# The three supported build configurations:
#
#   cargo cli      CLI only
#   cargo gui      CLI + Freya GUI  (same as a bare `cargo build`)
#   cargo viewer   Liminaldoc reader backend

# CLI only.
cli = "build --package lege --bin lege"
cli-check = "check --package lege --bin lege"
cli-run = "run --package lege --bin lege --"
# Retained names for existing developer scripts.
process = "build --package lege --bin lege"
process-check = "check --package lege --bin lege"
process-run = "run --package lege --bin lege --"

# CLI + Freya processor GUI. This is what the workspace default-members build.
gui = "build --package lege --package lege-gui-freya"
gui-check = "check --package lege --package lege-gui-freya"
gui-run = "run --package lege-gui-freya --bin lege-gui --"
gui-freya = "build --package lege --package lege-gui-freya"
gui-freya-check = "check --package lege --package lege-gui-freya"
gui-freya-run = "run --package lege-gui-freya --bin lege-gui --"

# Native document reader in the sibling Liminaldoc workspace.
viewer = "build --manifest-path ../liminaldoc/Cargo.toml -p liminaldoc-reader"
viewer-check = "check --manifest-path ../liminaldoc/Cargo.toml -p liminaldoc-reader"
viewer-run = "run --manifest-path ../liminaldoc/Cargo.toml -p liminaldoc-reader --bin liminaldoc-reader --"
viewer-gui = "build --manifest-path ../liminaldoc/Cargo.toml -p liminaldoc-reader"
viewer-gui-check = "check --manifest-path ../liminaldoc/Cargo.toml -p liminaldoc-reader"
viewer-gui-run = "run --manifest-path ../liminaldoc/Cargo.toml -p liminaldoc-reader --bin liminaldoc-reader --"
liminaldoc = "build --manifest-path ../liminaldoc/Cargo.toml --workspace"
liminaldoc-run = "run --manifest-path ../liminaldoc/Cargo.toml -p liminaldoc --bin liminaldoc --"

music-gui = "build --package lege-music-gui"
music-gui-check = "check --package lege-music-gui"

# Shared libraries / development utilities
gpu = "build --package lege-gpu"
gpu-check = "check --package lege-gpu"
ocr = "build --package lege-ocr"
ocr-check = "check --package lege-ocr"
document-ocr = "build --package lege-document-ocr-cli"
document-ocr-check = "check --package lege-document-ocr-cli"
document-ocr-run = "run --package lege-document-ocr-cli --"
pdf-write = "build --package lege-pdf-write"
pdf-write-check = "check --package lege-pdf-write"
pdf-tool = "build --package lege-pdf-agent --bin lege-pdf"
pdf-tool-check = "check --package lege-pdf-agent --bin lege-pdf"
pdf-tool-run = "run --package lege-pdf-agent --bin lege-pdf --"
lege-pdf = "build --package lege-pdf-agent --bin lege-pdf"
lege-pdf-check = "check --package lege-pdf-agent --bin lege-pdf"
lege-pdf-run = "run --package lege-pdf-agent --bin lege-pdf --"
ipc = "build --package lege-ipc"
xtask-help = "run --package xtask -- help"

# Standalone codec projects. These intentionally keep their own build graphs,
# so the aliases enter them through --manifest-path instead of workspace -p.
jbig2 = "build --manifest-path lege-codecs/jbig2enc-rust/Cargo.toml"
jp2 = "build --manifest-path lege-codecs/jp2lam/Cargo.toml"
djvu = "build --manifest-path lege-codecs/djvulibrust/Cargo.toml --features cli --bin djvu-encoder"

# Page-native writer in the sibling Liminaldoc workspace.
docwrite = "build --manifest-path ../liminaldoc/Cargo.toml -p docwrite-app --bin liminaldoc-writer"
docwrite-check = "check --manifest-path ../liminaldoc/Cargo.toml -p docwrite-app --all-targets"
docwrite-run = "run --manifest-path ../liminaldoc/Cargo.toml -p docwrite-app --bin liminaldoc-writer --"

# Android. `cargo check` for this target needs only
# `rustup target add aarch64-linux-android` — no NDK, because checking does not
# link. Keep it that way: it is why lege-ocr pins blake3 to its `pure` feature
# on Android rather than letting its build script reach for an NDK C compiler.
android-check = "check --package lege --target aarch64-linux-android --features android"
android-check-jni = "check --package lege-android --target aarch64-linux-android"
# Asserts the platform gate still fires. Expected to FAIL, with the
# `compile_error!` from lege-gpu/src/lib.rs as the only error.
android-check-gate = "check --package lege --target aarch64-linux-android"
# Building the .so does need the NDK plus `cargo install cargo-ndk`. The
# `android` profile exists because release sets panic = "abort", which would
# make the catch_unwind guards at the JNI boundary inert.
android-build = "ndk -t arm64-v8a --platform 26 build --package lege-android --profile android"

# Workspace-wide verification and common editions
ecosystem-check = "check --workspace"
build-debug-logging = "build --package lege --bin lege --profile debug-fast --features debug-logging"
run-debug-logging = "run --package lege --bin lege --profile debug-fast --features debug-logging --"
music-sheet = "build --release --target-dir target/music-sheet --no-default-features --features lege/music-sheet --package lege --package lege-music-gui"
music-sheet-check = "check --no-default-features --features lege/music-sheet --package lege --package lege-music-gui"
