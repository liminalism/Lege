# Production-path timing harness: renders through lege-pdf-read's RenderSession,
# the seam lege-process uses (see src/main.rs).
[package]
name = "lege-session-bench"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
lege-pdf-read = { path = "../../../../../../lege-pdf/read" }
mimalloc = { version = "0.1", optional = true, default-features = false }

[features]
mimalloc = ["dep:mimalloc"]

[workspace]

[profile.debug-fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
debug = true
strip = false
