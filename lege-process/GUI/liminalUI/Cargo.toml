[package]
name = "lege-gui-liminalui"
version = "1.0.0"
edition = "2024"
license.workspace = true
publish = false
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lege-gui"
path = "src/main.rs"

[features]
default = []
german = []
debug-logging = []
dark-mode = []

[dependencies]
# liminalkit comes from its GitHub repository; Cargo.lock pins the commit
# (`cargo update -p liminalkit-ui` moves it). To build against a local checkout
# instead, override in an untracked `.cargo/config.toml`:
#   [patch."https://github.com/liminalism/liminalkit"]
#   liminalkit-ui = { path = "../liminalkit/crates/liminalkit-ui" }   # etc.
liminalkit-shell = { git = "https://github.com/liminalism/liminalkit", branch = "main" }
liminalkit-windowing = { git = "https://github.com/liminalism/liminalkit", branch = "main" }
liminalkit-ui = { git = "https://github.com/liminalism/liminalkit", branch = "main" }
liminalkit-raster = { git = "https://github.com/liminalism/liminalkit", branch = "main" }
liminalkit-text = { git = "https://github.com/liminalism/liminalkit", branch = "main" }
rfd = { path = "../rfd" }
lege-ipc = { path = "../../lege-ipc" }
tokio = { version = "1.49", features = ["rt", "sync", "macros", "time"] }
anyhow.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json.workspace = true
dirs = "6.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
flume.workspace = true
winit.workspace = true
tempfile.workspace = true

[build-dependencies]
embed-resource = "3.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
