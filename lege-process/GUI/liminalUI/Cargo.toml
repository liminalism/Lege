[package]
name = "lege-gui-liminalui"
version = "1.0.0"
edition = "2024"
license.workspace = true
publish = false
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lege-gui"
path = "src/main.rs"

[features]
default = []
german = []
debug-logging = []
dark-mode = []

[dependencies]
liminalkit-shell = { path = "../../../../liminalkit/crates/liminalkit-shell" }
liminalkit-windowing = { path = "../../../../liminalkit/crates/liminalkit-windowing" }
liminalkit-ui = { path = "../../../../liminalkit/crates/liminalkit-ui" }
liminalkit-raster = { path = "../../../../liminalkit/crates/liminalkit-raster" }
liminalkit-text = { path = "../../../../liminalkit/crates/liminalkit-text" }
rfd = { path = "../rfd" }
lege-ipc = { path = "../../lege-ipc" }
tokio = { version = "1.49", features = ["rt", "sync", "macros", "time"] }
anyhow.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json.workspace = true
dirs = "6.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
flume.workspace = true
winit.workspace = true
tempfile.workspace = true

[build-dependencies]
embed-resource = "3.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
