[package]
name = "lege-gpu"
version = "0.1.0"
edition = "2024"
description = "Internal GPU compute backends for Lege"

[lib]
name = "lege_gpu"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
async-lock = "3.4.2"
bytemuck = { workspace = true }
log = { workspace = true }
once_cell = { workspace = true }
thiserror = { workspace = true }
image = { workspace = true }
rayon = { workspace = true }
pollster = "1.0.1"
winit = { workspace = true, optional = true }

# `static-dxc` links Microsoft's DXC shader compiler into the binary; wgpu's
# default DX12 compiler choice prefers it. Without it, Direct3D 12 falls back
# to FXC, which took 20-30 s to compile the layout model's shaders on every
# job (DXC: under 1 s). wgpu only pulls the dependency in on 64-bit Windows
# MSVC targets, so the feature is inert on Linux. Its build script downloads
# a prebuilt static library (crate `mach-dxcompiler-rs`), and linking it needs
# the Visual Studio component "C++ ATL for latest build tools" (`atls.lib`).
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
wgpu = { version = "30.0.0", default-features = false, features = ["std", "wgsl", "vulkan", "dx12", "static-dxc"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30.0.0", default-features = false, features = ["std", "wgsl", "metal"] }

# Android. Not feature-gated: without this section the crate has no `wgpu`
# dependency at all on Android and cannot compile, since 15 modules reference
# `wgpu::` unconditionally. A target section that does not match is never
# resolved, so this is inert on desktop.
#
# Vulkan only — no `gl`. See `src/android.rs` for why GLES is not viable here.
[target.'cfg(target_os = "android")'.dependencies]
wgpu = { version = "30.0.0", default-features = false, features = ["std", "wgsl", "vulkan"] }

[[example]]
name = "layout_compare"
required-features = ["layout-detection"]

[features]
default = []
# Android platform support. Gates `src/android.rs` and the Android backend
# policy; building for Android without it is a hard error (see `src/lib.rs`).
android = []
layout-detection = []
presentation = ["dep:winit"]
debug-logging = []
debug-layers = []
