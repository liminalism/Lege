# lege-docwrite — page-native book writing environment.
#
# Its own Cargo workspace, nested inside the Lege-ecosystem checkout at
# lege-docwrite/ (same pattern as lege-pdf/pdf-integrity). The PDF writer,
# reader and font crates are consumed through in-tree path dependencies; the
# window/input/raster host comes from the sibling pixelkit repository.
#
#   * crates/docwrite-model   — book tree, blocks, runs, styles, masters, edits
#   * crates/docwrite-typeset — shaping, line breaking, incremental pagination
#   * crates/docwrite-export  — PDF and Markdown now, IDML later
#   * crates/docwrite-app     — the `lege-docwrite` binary (pixelkit host)
[workspace]
resolver = "3"
members = [
    "crates/docwrite-model",
    "crates/docwrite-typeset",
    "crates/docwrite-export",
    "crates/docwrite-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"

[workspace.dependencies]
docwrite-model = { path = "crates/docwrite-model" }
docwrite-typeset = { path = "crates/docwrite-typeset" }
docwrite-export = { path = "crates/docwrite-export" }

# Lege crates, consumed by path from the sibling trees. They keep inheriting
# from the ecosystem workspace root; only the dependency edge is ours.
#
# The ecosystem root's [patch] entries for jbig2enc-rust and jp2lam do not
# carry over into this workspace. The ecosystem declares both by path, so they
# need no repeating here; if a transitive git-sourced codec dependency ever
# appears, it must be re-patched in this manifest.
lege-pdf-write = { path = "../lege-pdf/write" }
lege-pdf-read = { path = "../lege-pdf/read" }
pdf-font = { path = "../lege-pdf/render/crates/pdf-font" }
pdf-text = { path = "../lege-pdf/render/crates/pdf-text" }

# pixelkit: sibling repository next to Lege-ecosystem, path-only.
pixelkit-raster = { path = "../../pixelkit/crates/pixelkit-raster" }
pixelkit-text = { path = "../../pixelkit/crates/pixelkit-text" }
pixelkit-shell = { path = "../../pixelkit/crates/pixelkit-shell" }
pixelkit-ui = { path = "../../pixelkit/crates/pixelkit-ui" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"

# An editor must never lose a manuscript to an abort.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "warn"
